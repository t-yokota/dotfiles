model = "gpt-5.5"
model_reasoning_effort = "xhigh"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
notify = [
  "terminal-notifier",
  "-title",
  "Codex ECC",
  "-message",
  "Task completed!",
  "-sound",
  "default"
]
persistent_instructions = "Follow project AGENTS.md guidelines. Use available MCP servers when they can help."

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[features]
multi_agent = true

[profiles.strict]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"

[profiles.yolo]
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[mcp_servers.supabase]
command = "bunx"
args = ["@supabase/mcp-server-supabase@latest", "--features=account,docs,database,debugging,development,functions,storage,branching"]
startup_timeout_sec = 20.0
tool_timeout_sec = 120.0

[mcp_servers.playwright]
command = "bunx"
args = ["@playwright/mcp@latest"]
startup_timeout_sec = 30

[mcp_servers.context7]
command = "bunx"
args = ["@upstash/context7-mcp@latest"]
startup_timeout_sec = 30

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.github]
command = "bash"
args = ["-lc", "token=$(gh auth token 2>/dev/null || true); if [ -n \"$token\" ]; then export GITHUB_PERSONAL_ACCESS_TOKEN=\"$token\"; fi; exec bunx @modelcontextprotocol/server-github"]
startup_timeout_sec = 30

[mcp_servers.memory]
command = "bunx"
args = ["@modelcontextprotocol/server-memory"]
startup_timeout_sec = 30

[mcp_servers.sequential-thinking]
command = "bunx"
args = ["@modelcontextprotocol/server-sequential-thinking"]
startup_timeout_sec = 30
